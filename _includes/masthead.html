<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% if page.url contains '/zh/' %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item contact-button-container">
              <a href="/zh/contact/" class="contact-button">
                联系方式
              </a>
            </li>
            {% for link in site.data.navigation.main-zh %}
              <li class="masthead__menu-item"><a href="{% if link.url == '/zh/' %}/zh/?v=editorial-20260812{% else %}{{ domain }}{{ link.url }}{% endif %}">{{ link.title }}</a></li>
            {% endfor %}
          {% else %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item contact-button-container">
              <a href="/contact/" class="contact-button">
                Contact
              </a>
            </li>
            {% for link in site.data.navigation.main %}
              <li class="masthead__menu-item"><a href="{% if link.url == '/' %}/?v=editorial-20260812{% else %}{{ domain }}{{ link.url }}{% endif %}">{{ link.title }}</a></li>
            {% endfor %}
          {% endif %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
